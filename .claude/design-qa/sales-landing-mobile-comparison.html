<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CBO mobile landing comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #102c54; background: #bdc8c0; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 18px; font-size: 24px; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; font-weight: 800; }
      img { display: block; width: 100%; height: auto; border: 2px solid #102c54; background: #f6f0df; }
    </style>
  </head>
  <body>
    <h1>Current live baseline and three sales-landing directions - 390 x 844 viewport</h1>
    <div class="grid">
      <figure><figcaption>Current live baseline</figcaption><img src="pm-home-mobile.png" alt="Current live CBO homepage at mobile size."></figure>
      <figure><figcaption>1 - Problem first</figcaption><img src="sales-landing-problem-first-mobile-fold.png" alt="Problem-first CBO landing mock at mobile size."></figure>
      <figure><figcaption>2 - Mechanism first</figcaption><img src="sales-landing-mechanism-first-mobile-fold.png" alt="Mechanism-first CBO landing mock at mobile size."></figure>
      <figure><figcaption>3 - Adoption first</figcaption><img src="sales-landing-adoption-first-mobile-fold.png" alt="Adoption-first CBO landing mock at mobile size."></figure>
    </div>
  </body>
</html>
