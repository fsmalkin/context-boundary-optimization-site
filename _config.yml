title: Context-Boundary Optimization
description: >-
  Services computing, per task and at runtime, the information architecture an
  agent needs to act well.
theme: jekyll-theme-cayman
# Publication roots. Files inside these directories are served unless they are
# explicitly excluded below.
include:
  - papers
  - figures
  - library
  - demos
  - data
exclude:
  - demos/figure-comparison.html
  - "*.receipt.txt"
  - Gemfile
  - Gemfile.lock
